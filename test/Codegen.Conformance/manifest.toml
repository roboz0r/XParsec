# The backend conformance corpus.
#
# Every `.fs` under this directory (`ops/` — arithmetic; `classes/` — nominal types) is a
# self-contained program in OUR dialect — data, never
# a `<Compile>` item — read as text and compiled through this repo's own pipeline.
# It PRINTS computed values and nothing else: the judgement lives in the `.expected`
# golden beside it, which carries F# semantics rather than any backend's current
# opinion. A program that judged itself (`if x = y then 1 else 0`) would be trusting
# `=`, one of the very things a backend can get wrong. (The exception is an `accept`
# program, below, whose subject has no printable result at all.)
#
# This file states, per program, what each backend OWES. These are the only legal
# obligations, and there is no state in which a clause exists but quietly computes the
# wrong thing:
#
#   run       — compile it, run it, exit 0, and match the golden byte for byte.
#   faults    — compile it, run it, and DIE with a runtime error mentioning this text
#               (case-insensitively). Replaces the golden: a program that must die
#               produces no stdout worth asserting on. Not an exit code — the CLR
#               harness runs the entry point in-process, where an uncaught exception
#               never becomes one.
#   diagnose  — REJECT it at COMPILE time, with an error containing the given
#               substring. A width the target cannot represent must have no clause at
#               all; emitting garbage for it is the failure this corpus exists to
#               forbid.
#   accept    — compile it clean, and assert nothing further. `diagnose`'s exact
#               negation, for a subject the target ACCEPTS but no stdout can observe:
#               `when 'a : struct` holding at `int` admits the call and yields no value
#               to print. Carries NO golden.
#
# `run` / `faults` / `accept` are lists of backends, each owing the same outcome;
# `diagnose` carries a per-backend message, because rejection is exactly where two
# targets legitimately differ — and a program may `accept` on one and `diagnose` on
# another. A backend named nowhere owes nothing for that program.
#
# THE SUPPORT KEYS. `run` / `faults` / `diagnose` pin BEHAVIOUR — what a backend does
# with a program. Two further keys pin STRUCTURE, and together they make this file the
# (width × operator) → backend arithmetic support matrix rather than leaving it implicit
# in the file names:
#
#   width     — the primitive this program is about.
#   operators — which arithmetic operators the program's obligations are about. The
#               default is all of them (`+ - * / % ~- ~+`).
#
# The two together are the key. Support is a property of the PAIR, never of the width
# alone: `byte` supports `+` on both backends and `~-` on NEITHER (negating an unsigned
# value has no answer the width can hold, and F# defines none — FSharp.Core's
# `UnaryNegationDynamic` lists the signed widths only). A matrix keyed by width alone
# could not say that, and would silently demand a `~-` declaration of every width it demanded
# a `+` declaration of — which is exactly how the unsigned `~-` clauses came to exist,
# answering 56 on JS and -200 on the CLR with no program looking at either.
#
# For each (width, operator) a program names: a backend that must `run` it MUST have that
# width DECLARE the operator (`static member (+)` on `prim-types-*.fsi`, with the body in
# the per-target `.fs`); a backend that must `diagnose` it must have none. That is the whole
# definition of "which types support which arithmetic on this target" — a width that
# declares nothing falls to the SRTP trait call, resolves no member, and is a compile error
# — and it is checked mechanically
# (`XParsec.FSharp.Codegen.Common.Tests.OperatorSurfaceParity`), so a declaration ADDED for
# a pair that must be rejected is caught without anyone having to think to write a program
# for it. A pair the manifest never names is a declaration nothing judges, and fails the
# same guard. The two backends read the SAME declarations; what makes their answers differ
# is representability alone (`decimal` has no JS repr).
#
# A program about no single width simply OMITS `width` and contributes nothing to the
# matrix: `arith-unsigned-div.fs` spans every unsigned width, `arith-negate.fs` every
# signed one, and `arith-div-by-zero.fs` is about faulting, not about a width.

[[program]]
path = "ops/arith-int.fs"
run = ["clr", "js"]
width = "int"

[[program]]
path = "ops/arith-int64.fs"
run = ["clr", "js"]
width = "int64"

# The UNSIGNED widths carry the five BINARY operators and no `~-` — see
# `ops/arith-negate-unsigned.fs`, which pins the rejection. Their `operators` narrowing is
# what stops the guard demanding a negation clause nothing could judge. `~+` IS in their
# list: unlike negation, the identity has an answer at an unsigned width.
[[program]]
path = "ops/arith-byte.fs"
run = ["clr", "js"]
width = "byte"
operators = ["+", "-", "*", "/", "%", "~+"]

[[program]]
path = "ops/arith-sbyte.fs"
run = ["clr", "js"]
width = "sbyte"

[[program]]
path = "ops/arith-int16.fs"
run = ["clr", "js"]
width = "int16"

[[program]]
path = "ops/arith-uint16.fs"
run = ["clr", "js"]
width = "uint16"
operators = ["+", "-", "*", "/", "%", "~+"]

[[program]]
path = "ops/arith-uint32.fs"
run = ["clr", "js"]
width = "uint32"
operators = ["+", "-", "*", "/", "%", "~+"]

[[program]]
path = "ops/arith-uint64.fs"
run = ["clr", "js"]
width = "uint64"
operators = ["+", "-", "*", "/", "%", "~+"]

# The truncation probe: a uint64 LITERAL at or above 2^32. Both backends must carry the
# magnitude the width promises — the literal's own model has to be 64-bit, not merely its
# arithmetic. A SECOND program for pairs already in the matrix: the two rows must agree
# about them (a pair cannot be `run` by a backend in one row and `diagnose`d in another).
[[program]]
path = "ops/arith-uint64-wide.fs"
run = ["clr", "js"]
width = "uint64"
operators = ["+", "-", "*", "/", "%", "~+"]

[[program]]
path = "ops/arith-float.fs"
run = ["clr", "js"]
width = "float"

[[program]]
path = "ops/arith-float32.fs"
run = ["clr", "js"]
width = "float32"

# The one non-numeric operand the arithmetic contract admits: `+` is concatenation and
# the other five are meaningless on it.
[[program]]
path = "ops/arith-string.fs"
run = ["clr", "js"]
width = "string"
operators = ["+"]

[[program]]
path = "ops/arith-unsigned-div.fs"
run = ["clr", "js"]

# Negation of every SIGNED width, each at its minimum so the wrap is observed and not
# merely the sign flip. It spans several widths, so it pins no single (width, operator)
# pair and carries no `width` — the per-width rows above already put `~-` in the matrix
# for the signed widths, by taking the `operators` default.
[[program]]
path = "ops/arith-negate.fs"
run = ["clr", "js"]

# Prefix plus at a spread of widths, the unsigned ones included — the identity, so what
# the two backends must agree on is that each width's operand comes back unchanged and at
# its own magnitude. Spans several widths, so it carries no `width`.
[[program]]
path = "ops/arith-unary-plus.fs"
run = ["clr", "js"]

# …and the other half of that statement: `~-` on an UNSIGNED width is rejected, on both
# backends, for the same reason (no clause ⇒ the SRTP base cannot resolve). One `(width,
# operator)` pair, whose obligation is the opposite of the one `ops/arith-byte.fs` states
# for the same width — which the pair-keyed matrix can say and a width-keyed one could not.
[[program]]
path = "ops/arith-negate-unsigned.fs"
diagnose = { clr = "does not support the operator", js = "does not support the operator" }
width = "byte"
operators = ["~-"]

# Integer division by zero raises rather than returning a value. The one width whose
# clause throws today is int32 (CIL `div`); the message is the BCL's, and a target
# whose `/` cannot throw is expected to say the same words.
[[program]]
path = "ops/arith-div-by-zero.fs"
run = ["clr", "js"]
faults = "attempted to divide by zero"

# The bitwise family, now that each width declares `&&& ||| ^^^ ~~~ <<< >>>` on itself
# rather than sharing one width-blind opcode. Every width in one program: what the two
# backends must agree on is the per-width narrowing (`~~~` on an unsigned width, `>>>`
# zero-filling vs sign-extending), and a matrix keyed by width could not say that the
# widths must agree with EACH OTHER. Carries no `width`, so it contributes nothing to
# the arithmetic-operator matrix — that matrix is about `+ - * / %`.
[[program]]
path = "ops/bitwise-widths.fs"
run = ["clr", "js"]

# The other half: a non-integral operand is REJECTED, on both backends, because `float`
# declares no such member. Before the family was declared per width this compiled to CIL
# `and` over two float64s and threw `InvalidProgramException` at run time.
[[program]]
path = "ops/bitwise-float.fs"
diagnose = { clr = "does not support the operator", js = "does not support the operator" }

# `nativeint` / `unativeint` have a CLR representation and no decided JS one. The
# asymmetry is stated here rather than smuggled into a file header: JS must REJECT
# these, and the message it owes is the platform-representation verdict — the type
# itself has no JS form, so the question never reaches an operator clause.
# (`diagnose` is an inline table because a `[program.diagnose]` sub-table cannot hang
# off an array-of-tables entry in this repo's TOML reader.)
[[program]]
path = "ops/arith-nativeint.fs"
run = ["clr"]
diagnose = { js = "nativeint is not supported on the js target" }
width = "nativeint"

[[program]]
path = "ops/arith-unativeint.fs"
run = ["clr"]
diagnose = { js = "unativeint is not supported on the js target" }
width = "unativeint"
operators = ["+", "-", "*", "/", "%", "~+"]

# `decimal` is the width the two backends differ on for the plan's ONE reason: the CLR has a
# repr for it and JS has none, so the same six declarations on `prim-types-decimal.fsi` are
# reachable there and unreachable here. It is also the only width whose bodies are BCL CALLS
# (`Decimal.Add`, …) — no CIL mnemonic adds two decimals — so its golden is what judges that
# a spliced call answers as a spliced opcode does.
[[program]]
path = "ops/arith-decimal.fs"
run = ["clr"]
diagnose = { js = "decimal is not supported on the js target" }
width = "decimal"

# `=` and `<` at the primitives. Neither is in the (width × operator) matrix — that matrix
# is about `+ - * / %` — so these carry no `width`, exactly as the bitwise programs do.
[[program]]
path = "ops/equality-primitives.fs"
run = ["clr", "js"]

[[program]]
path = "ops/comparison-primitives.fs"
run = ["clr", "js"]

# `bigint` is the other non-CIL-primitive width, and the one both backends represent — the
# BCL `BigInteger` and the JS `BigInt` primitive. It is the only width in this matrix with
# no bound to wrap to, so its golden is the one that goes past 2^64 and stays exact.
[[program]]
path = "ops/arith-bigint.fs"
run = ["clr", "js"]
width = "bigint"

# ---------------------------------------------------------------------------------------
# THE CLASS PREAMBLE — instance `let` / `do` in a type definition.
#
# The two backends implemented it INDEPENDENTLY, from one spec, and nothing structural
# makes them agree: the CLR gives each `let` a backing field written by the ctor; JS writes
# a property on `this`. Every other assertion about the preamble is per-backend, and so
# green in both suites at once even when the two answers differ. These programs are what
# make the AGREEMENT a tested property — they carry no `width` and so contribute nothing to
# the arithmetic matrix.
#
# `inherit` (a base-ctor call before the preamble) is on NEITHER backend's `run` list, by
# design, and so has no program here: the JS backend has no `extends`/`super(…)` and REJECTS
# it rather than dropping it. A `run = ["clr", "js"]` program for it could not pass; a
# `run = ["clr"]` one would be a per-backend test wearing the corpus's clothes, which is what
# this file exists to stop. Its JS rejection is pinned in the JS suite, its CLR behaviour in
# the CLR suite.
#
# A `static let mutable` (below) DOES run on both: the CLR stores to a private static field
# (`stsfld`), JS assigns a property on the emitted class object, and the shared-cell
# accumulation must agree — exactly the divergence a conformance case exists to catch.

[[program]]
path = "classes/preamble-let.fs"
run = ["clr", "js"]

[[program]]
path = "classes/preamble-mutable.fs"
run = ["clr", "js"]

[[program]]
path = "classes/preamble-do-order.fs"
run = ["clr", "js"]

[[program]]
path = "classes/preamble-let-rec.fs"
run = ["clr", "js"]

[[program]]
path = "classes/preamble-generic.fs"
run = ["clr", "js"]

[[program]]
path = "classes/preamble-fn-value.fs"
run = ["clr", "js"]

[[program]]
path = "classes/static-mutable.fs"
run = ["clr", "js"]

# ---------------------------------------------------------------------------------------
# RECORDS — a [<Struct>] record. The CLR emits it as a System.ValueType-based value type;
# JS has no value types and emits it as an ordinary reference object. The observable
# results (construction, field reads, structural equality, `{ r with … }`) must AGREE
# across the two, which is exactly what a conformance case pins — a per-backend test
# could not catch a divergence in either the CLR value-type IL or the JS reference form.
[[program]]
path = "records/struct-record.fs"
run = ["clr", "js"]

[[program]]
path = "records/record-members.fs"
run = ["clr", "js"]

# ---------------------------------------------------------------------------------------
# INLINE — `let inline` is an ordinary module function that is ALSO a splice template.
# Both backends emit the function and both splice the body, and the two have to agree on
# the answer. These programs are here rather than in a per-backend suite because the
# failure mode is asymmetric and neither suite would notice its own half: the CLR builds a
# static method body, JS writes a module-level definition and an export, and a badly
# emitted one breaks the JS MODULE (a dangling reference fails to load before a line is
# printed) while merely sitting unused on the CLR. Carrying no `width`, they contribute
# nothing to the arithmetic matrix.
[[program]]
path = "inline/inline-toplevel.fs"
run = ["clr", "js"]

[[program]]
path = "inline/inline-module.fs"
run = ["clr", "js"]

# ---------------------------------------------------------------------------------------
# TYPAR CONSTRAINTS over PRIMITIVES — `when 'a : struct` and `when 'a : not struct`.
#
# Value-ness of a primitive is the TARGET's own answer, which two targets need not share, so
# no shared contract states it and only a harness compiling through both real platform
# providers pins it. Equality and comparison ARE contract-prescribed and stay in the
# semantic-analysis suite; what the corpus adds for them is the operator behaviour above.
#
# The two polarities pin different amounts. A refusal is a compile error, so `diagnose`
# states it exactly; satisfaction has no printable result, so it is `accept`.
[[program]]
path = "constraints/typar-struct.fs"
accept = ["clr", "js"]

[[program]]
path = "constraints/typar-struct-violated.fs"
diagnose = { clr = "does not support the 'struct' constraint", js = "does not support the 'struct' constraint" }

[[program]]
path = "constraints/typar-not-struct.fs"
accept = ["clr", "js"]

[[program]]
path = "constraints/typar-not-struct-violated.fs"
diagnose = { clr = "does not support the 'not struct' constraint", js = "does not support the 'not struct' constraint" }
