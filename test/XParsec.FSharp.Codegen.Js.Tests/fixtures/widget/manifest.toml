# widget — a minimal test-only fixture package that carries a concrete
# `(# … #)`-bodied member on an intrinsic/`extern` type. It proves the W9 member-inline
# SPLICE end-to-end: the `.fsi` is the consumer-side contract (a dual-faced Class +
# `Poke` member), and the `.js.fs` companion is the harvest source whose member body the
# codegen inline-body loader keys under the finalized member key. No `depends-on`: the
# only external it names is the primitive `int`, resolved through whatever provider stack
# the package is loaded into (the test stacks it ahead of `jsManifests`, which carry
# Vesper.Core). Modeled on `src/Vesper.Core` / `src/Vesper.List`.

# GLOBAL namespace (empty): the type's compiled name is the bare `widget`, so the
# member-inline store — which keys the harvested body under `TryLookupMember(tdecl.Name,
# …)` with `tdecl.Name` the SIMPLE type name — resolves against the provider (whose
# `TryLookupMember` matches by the qualified compiled name). A namespaced fixture would
# key the body under `widget` but the provider would only serve `Ns.widget`, so the store
# would silently miss. See the report note on the namespaced-type store-keying gap.
[core]
name = "widget"
namespace = ""
description = "Test fixture: a `(# … #)`-bodied member (`Poke`) on an `extern` type."

# The front-end symbol contract: `type widget = extern with member Poke: int -> int`.
files = [
    "widget.fsi",
]

# The JS-target harvest source: `type widget = (# "object" #) with member _.Poke …`.
# Read by the codegen inline-body loader (`resolveInlineBodies (Some "js")`), whose
# `harvestMemberBody` mints the `this`-first inline body served under `Poke`'s key.
inline-bodies-js = [
    "widget.js.fs",
]
