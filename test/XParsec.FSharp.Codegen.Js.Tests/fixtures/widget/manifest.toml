# widget — a minimal test-only fixture package that carries a concrete
# `(# … #)`-bodied member on an intrinsic/`extern` type. It proves the member-inline
# SPLICE end-to-end: the `.fsi` is the consumer-side contract (an `extern` host +
# `Poke` member), and the `.js.fs` companion is the body source whose member body the
# codegen inline-body loader keys under the finalized member key. No `depends-on`: the
# only external it names is the primitive `int`, resolved through whatever provider stack
# the package is loaded into (the test stacks it ahead of `jsManifests`, which carry
# Vesper.Core). Modeled on `src/Vesper.Core` / `src/Vesper.List`.

# NAMESPACED: `widget.fsi` declares `namespace Widgets`, so the compiled name is
# `Widgets.widget`. The member-inline store keys the lifted body by the QUALIFIED name
# (`SymbolKeyOps.qualifiedName tdecl.Key`), which is exactly what the provider's
# `TryLookupMember` matches — so a namespaced intrinsic resolves end-to-end (this fixture
# is the regression guard for that keying). `Widgets` is not in the implicit prelude, so
# the consumer snippets `open Widgets` like any other namespace.
[core]
name = "widget"
description = "Test fixture: a `(# … #)`-bodied member (`Poke`) on an `extern` type."

# The front-end symbol contract: `widget` with `Poke`, and `gadget` with `Bump`.
files = [
    "widget.fsi",
]

[targets.js]
# The bodies. Every declaration in them is `inline`, so the package emits no DLL and these
# are purely SPLICE sources — the inline-body loader mints each `member inline` as a
# `this`-first inline body served under that member's key. Listing them here is also what
# marks `widget`/`gadget` as intrinsics (their `(# "object" #)` binding is the marker), so
# the fixture pins that a member on an INTRINSIC host splices — instance and static alike.
# `gadget.js.fs` is the NON-IL-bodied case: its body is a keyed `widget.Poke` call, and it
# publishes because it is declared `inline`, not because of anything the body is.
impl = [
    "widget.js.fs",
    "gadget.js.fs",
]
