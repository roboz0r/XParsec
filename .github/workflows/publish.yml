name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

env:
  CONFIGURATION: Release
  NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Get Package Version
        shell: pwsh
        run: |
          [xml]$BuildProps = Get-Content ./Directory.Build.props
          $PackageVersion = $BuildProps.Project.PropertyGroup.PackageVersion
          [semver]$PackageVersion = "$PackageVersion".Trim()
          $TagName = $env:GITHUB_REF_NAME
          $TagVersion = $TagName -replace '^v', ''
          Write-Output "Pushed tag is '$TagName' (version: '$TagVersion')"
          Write-Output "PackageVersion in Directory.Build.props is '$PackageVersion'"
          if ("$PackageVersion" -ne "$TagVersion") {
            Write-Error "Tag version '$TagVersion' does not match PackageVersion '$PackageVersion' in Directory.Build.props"
            exit 1
          }
          Write-Output "Creating Packages with version='$PackageVersion'"
          Write-Output "PACKAGE_VERSION=$PackageVersion" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack Published Projects
        shell: pwsh
        run: |
          $Project = "./src/XParsec/XParsec.fsproj"
          dotnet restore $Project
          dotnet list $Project package
          dotnet pack $Project
          dotnet nuget push "./src/XParsec/bin/Release/XParsec.$env:PACKAGE_VERSION.nupkg" --api-key $env:NUGET_TOKEN --source "nuget.org" --skip-duplicate
