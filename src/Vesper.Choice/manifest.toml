# Vesper.Choice — the `Choice<'T1, 'T2>` type as a standalone package
# (package-split-plan PS1: one package per type; PS2: one impl DLL per package).
#
# Same shape as src/Vesper.Result / src/Vesper.Option: the `.fsi` is the
# front-end symbol contract (parsed by XParsec.FSharp, walked into an
# IExternalSymbolProvider); `choice.fs` is the runtime impl compiled by this
# repo's own backend → Vesper.Choice.dll (BCL-only, no FSharp.Core). No `.fsproj`:
# like its siblings this tree is not built by `dotnet`/`fsc`.
#
# Depends on Vesper.Core (`unit`, `bool`, `int`). `name` and `depends-on` are
# recorded here per the package-split-plan package schema; these self-contained
# package manifests are consumed today by the parser golden tests
# (test/Vesper.Tests/VesperCoreContractTests.fs).
#
# Per PS5 the package is named `Vesper.Choice` but contributes type `Choice` into
# namespace `Vesper`, not `Vesper.Choice`.
#
# See ./README.md.

[core]
name = "Vesper.Choice"
namespace = "Vesper"
description = "The Choice<'T1, 'T2> two-way disjoint union type."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "choice.fsi",
]

# Runtime impl `.fs` files (our-backend target source).
impl = [
    "choice.fs",
]
