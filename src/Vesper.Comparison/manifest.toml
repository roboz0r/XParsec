# Vesper.Comparison — the ordering family as a standalone package
# (package-split-plan PS1/PS4; operators-plan.md O2).
#
# Same shape as src/Vesper.Core: the `.fsi` is the front-end symbol contract
# (parsed by XParsec.FSharp, walked into an IExternalSymbolProvider) and the
# `.fs` is the per-target *implementation* — F# static-optimization over inline
# IL, read across the package boundary by the codegen inline-body loader
# (`SymbolProviders.inlineBodies`) and spliced at each use site. Same
# cross-package-inline mechanism Vesper.Core's `(=)` / `(<>)` / `hash` use
# (operators-plan.md O6): per-primitive clauses lower to CIL `clt` / `cgt`,
# the structural-comparison base routes through `Comparer<^T>.Default.Compare(x, y)`
# for an opted-in record / union.
#
# Depends on Vesper.Core (`Fun`, `unit`, `bool`, the `when 'T: comparison`
# constraint vocabulary, and the recognised comparison attributes which live in
# Core per O5). `name` and `depends-on` are recorded here per the
# package-split-plan package schema; the root-manifest / a la carte loader wiring
# (PS-Loader) — and the default-contract-closure membership that keeps `1 < 5`
# available without an explicit reference (operators-plan.md O3) — is a separate
# follow-up (slice C-Cmp1).
#
# This pass stands up the contract surface + the four operator bodies; `compare`
# / `min` / `max` join them in C-Cmp1.
#
# See ../XParsec.FSharp.SemanticAnalysis/docs/package-split-plan.md and
# ../XParsec.FSharp.SemanticAnalysis/docs/operators-plan.md.

[core]
name = "Vesper.Comparison"
namespace = "Vesper"
description = "The ordering operators (< > <= >=); compare/min/max land in C-Cmp1."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "comparison.fsi",
]

# No `impl`: the four ordering operators are signature-only (`let inline` over
# static-optimized inline IL, spliced at each use site), so the package emits no
# runtime DLL — `comparison.fs` is purely an inline-body source.
impl = []

# Per-target `.fs` body the codegen inline-body loader reads across the package
# boundary: the static-optimization over
# inline IL for each of the four bare ordering operators.
inline-bodies = [
    "comparison.fs",
]
