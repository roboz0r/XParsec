[core]
name = "Vesper.Comparison"
description = "The ordering operators (< > <= >=)."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "comparison.fsi",
]

[targets.clr]
# Every declaration is `inline` (a static optimization over inline IL for each of the four
# bare ordering operators), so this compiles to an empty DLL and splices at each use site.
# The file declares no types, so naming it here publishes no intrinsic marker.
impl = [
    "comparison.fs",
]

[targets.js]
# JS-only contract, appended to `files`. `structuralCompare` is a JS runtime entry (the
# `< > <= >=` aggregate bases delegate to it for non-primitive operands, body in
# `Vesper.Comparison.mjs`); it has no CLR `.fs` body, so it is NOT in the shared contract.
files = [
    "comparison-runtime.js.fsi",
]

# The operator bodies re-authored as `$N`-template JS.
impl = [
    "comparison.js.fs",
]

runtime = [
    "Vesper.Comparison.mjs",
]
