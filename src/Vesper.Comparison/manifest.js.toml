[core]
name = "Vesper.Comparison"
description = "The ordering operators (< > <= >=)."
depends-on = ["../Vesper.Core"]

# Signature files in compile order. `structuralCompare` is a JS runtime entry (the
# `< > <= >=` aggregate bases delegate to it for non-primitive operands, body in
# `Vesper.Comparison.mjs`); it has no CLR `.fs` body, so the clr manifest does not name it.
files = [
    "comparison.fsi",
    "comparison-runtime.js.fsi",
]

# The operator bodies re-authored as `$N`-template JS.
impl = [
    "comparison.js.fs",
    # `structuralCompare` as an `[<Import>]`-attributed binding served by `Vesper.Comparison.mjs`.
    "comparison-runtime.js.fs",
]

runtime = [
    "Vesper.Comparison.mjs",
]
