[core]
name = "Vesper.Seq"
description = "The Seq module over seq<'T> (fold, reduce, truncate, toArray)."
# `Vesper.Array` is `toArray`'s: it returns `'T[]` and builds its buffer with
# `Array.zeroCreate`.
depends-on = ["Vesper.Core", "Vesper.List", "Vesper.Comparison", "Vesper.Array"]

# Contract `.fsi` files in compile order, on EVERY target.
files = [
    "seq.fsi",
]

# Target-NEUTRAL, no per-target prelude. `toArray` builds a doubling buffer over
# `Array.zeroCreate`; `truncate` is a hand-rolled lazy cursor over the `seq` / `enumerator`
# capabilities — an interface on CLR, `Symbol.iterator` on JS.
impl = [
    "seq.fs",
]

[targets.clr]
# CLR-only CONTRACT, appended after `[core] files`. `struct-seq.fsi` names the NON-generic
# `System.Collections.IEnumerable` / `IEnumerator`, which the JS capability shim does not
# map, and every type in it is `[<Struct>]` for zero-allocation by-value chaining.
files = [
    "struct-seq.fsi",
]

# CLR-only: the by-value struct chaining above. Appended after `[core] impl`'s `seq.fs`.
impl = [
    "struct-seq.clr.fs",
]

[targets.js]
# JS runtime *asset*: the `Seq` module functions plus the truncate cursor, imported by a
# consumer and shipped beside its output. GENERATED from `seq.fs`, not hand-authored;
# regenerable via the codegen-js test suite.
runtime = ["Vesper.Seq.mjs"]
