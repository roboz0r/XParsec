# Vesper.Seq — the `Seq` module over `seq<'T>` (= `IEnumerable<'T>`) as a
# standalone package (package-split-plan PS1: one package per type/module; PS2:
# one impl DLL per package).
#
# Same shape as src/Vesper.Array / src/Vesper.List: the `.fsi` is the front-end
# symbol contract (parsed by XParsec.FSharp, walked into an
# IExternalSymbolProvider); `seq.fs` is the runtime impl compiled by this repo's
# own backend → Vesper.Seq.dll (BCL-only, no FSharp.Core). No `.fsproj`: like its
# siblings this tree is not built by `dotnet`/`fsc`.
#
# Depends on Vesper.Core (`Fun`, `int`, `'T[]`) and Vesper.List (the `seq<'T>` and
# `ResizeArray<'T>` abbreviations declared in `list.fsi`). `name` and `depends-on`
# are recorded here per the package-split-plan package schema; these
# self-contained package manifests are consumed today by the parser golden tests
# (test/Vesper.Tests/VesperCoreContractTests.fs).
#
# Per PS5 the package is named `Vesper.Seq` but contributes the `Seq` module into
# namespace `Vesper.Collections`, not `Vesper.Seq`.
#
# See ./README.md.

[core]
name = "Vesper.Seq"
namespace = "Vesper.Collections"
description = "The Seq module over seq<'T> (fold, reduce, truncate, toArray)."
depends-on = ["Vesper.Core", "Vesper.List"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "seq.fsi",
]

# Runtime impl `.fs` files (our-backend target source).
impl = [
    "seq.fs",
]
