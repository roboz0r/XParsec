[core]
name = "Vesper.Seq"
description = "The Seq module over seq<'T> (fold, reduce, truncate, toArray)."
# `Vesper.Array` is `toArray`'s: it returns `'T[]` and builds its buffer with
# `Array.zeroCreate`.
depends-on = ["../Vesper.Core", "../Vesper.List", "../Vesper.Comparison", "../Vesper.Array"]

# `toArray` builds a doubling buffer over `Array.zeroCreate`; `truncate` is a hand-rolled
# lazy cursor over the `seq` / `enumerator` capabilities — an interface on CLR.
# `struct-seq` is CLR-only: its `.fsi` names the NON-generic `System.Collections.IEnumerable`
# / `IEnumerator`, which the JS capability shim does not map, and every type in it is
# `[<Struct>]` for zero-allocation by-value chaining.
files = [
    "seq.fsi",
    "seq.fs",
    "struct-seq.fsi",
    "struct-seq.clr.fs",
]
