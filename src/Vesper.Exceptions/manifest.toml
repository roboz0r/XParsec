[core]
description = "Common BCL exception roots as Vesper contract types inheriting exn."
depends-on = ["Vesper.Core"]

files = [
    "exceptions.fsi",
]

# Impl-free on every target: the mechanism is BCL-resolved on CLR and comes via
# `prim-types-exn` on JS. Listing the `.fsi` here is what exempts it — an unlisted
# `.fsi`-without-`.fs` is an FS0240 hard error.
sig-only = [
    "exceptions.fsi",
]
