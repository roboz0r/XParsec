[core]
description = "Common BCL exception roots as Vesper contract types inheriting exn."
depends-on = ["Vesper.Core"]

files = [
    "exceptions.fsi",
]

# Impl-free on every target: the exception mechanism is BCL-resolved
# (`System.Private.CoreLib`), and the JS representation comes via `prim-types-exn`, not a
# `.fs` here. The conformance pass accepts this exemption; an un-listed
# `.fsi`-without-`.fs` would be an FS0240 hard error.
sig-only = [
    "exceptions.fsi",
]
