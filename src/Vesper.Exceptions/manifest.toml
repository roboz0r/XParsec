# Vesper.Exceptions — the common BCL exception roots as Vesper *contract* types.
#
# A JS-target package: it lets `InvalidOperationException` & co. resolve through a
# Vesper-owned `inherit exn` chain WITHOUT host BCL metadata, so a BCL-free JS
# build type-checks and lowers `raise (InvalidOperationException …)` to a native
# `new Error`. The types are declared under `namespace System` (matching the BCL
# names a consumer reaches via `open System`); on JS they all erase to the `exn`
# root (`Error`).
#
# It is referenced by the JS provider only (TestHelpers `jsManifests` /
# `coreDepsJsProvider`). CLR builds do NOT reference it — they keep resolving the
# same names through `System.Private.CoreLib` (the metadata layer), so the
# contract never shadows the BCL type in a CLR `newobj` (which would mint a
# TypeRef into the wrong assembly). The shared seam stays the `.fsi` contract; the
# per-target binding is `prim-types-exn`'s `(# … #)` repr (`System.Exception` on
# CLR, `Error` on JS).

[core]
namespace = "System"
description = "Common BCL exception roots as Vesper contract types inheriting exn."
depends-on = ["Vesper.Core"]

files = [
    "exceptions.fsi",
]

# Impl-free on CLR: the exception mechanism is BCL-resolved (`System.Private.CoreLib`),
# and the JS representation comes via `prim-types-exn`, not a base `.fs`. The
# conformance pass (T8 Step 5) accepts this exemption; an un-listed `.fsi`-without-`.fs`
# would be an FS0240 hard error.
sig-only = [
    "exceptions.fsi",
]
