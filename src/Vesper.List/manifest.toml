# Vesper.List — the cons-list type + the `List` module as a standalone package
# (package-split-plan PS1: one package per type; PS2: one impl DLL per package).
#
# Same shape as src/Vesper.Core / src/Vesper.Option / src/Vesper.Printf: the
# `.fsi` is the front-end symbol contract (parsed by XParsec.FSharp, walked into
# an IExternalSymbolProvider); `list.fs` is the runtime impl compiled by this
# repo's own backend → Vesper.List.dll (BCL-only, no FSharp.Core). No `.fsproj`:
# like its siblings this tree is not built by `dotnet`/`fsc`.
#
# Depends on Vesper.Core (`Fun`, `unit`, `int`, `bool`). The `list.fsi` contract
# also names `int option` (in `List.GetSlice`), but the compiled impl (`list.fs`)
# does not, so `depends-on` tracks the build dependency only (Vesper.Option will
# return here if `GetSlice` is implemented). `name` and `depends-on` are recorded
# here per the package-split-plan package schema; the
# root-manifest / a la carte loader wiring (PS-Loader) is a separate follow-up —
# these self-contained package manifests are consumed today by the parser golden
# tests (test/XParsec.FSharp.Tests/VesperCoreContractTests.fs).
#
# Per PS5 the package is named `Vesper.List` but contributes type `List` into
# namespace `Vesper.Collections`, not `Vesper.List`.
#
# See ./README.md and
# ../XParsec.FSharp.SemanticAnalysis/docs/package-split-plan.md.

[core]
name = "Vesper.List"
namespace = "Vesper.Collections"
description = "The immutable cons-list type and the List module."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "list.fsi",
]

# Runtime impl `.fs` files (our-backend target source). `list.fs` is the compiled
# impl in the verbatim `[]`/`::` operator-case form — the cutover target that the
# old `list-min.fs` (named `Nil`/`Cons` cases) was a placeholder for, now buildable
# because the front end lowers cons patterns/construction (vesper-lib-test-plan
# "list.fs cutover"). `list-min.fs` was removed once the cutover landed.
impl = [
    "list.fs",
]

# Hand-authored JS runtime *asset* (codegen-js-steps.md Step 5b): the cons-list
# module functions (`List.length`/`map`/…) the JS backend imports and ships beside
# its output, read via `ReferencedProject.runtimeModules`. See Vesper.Core's
# `runtime-js` note for the platform-support-asset pattern.
runtime-js = ["Vesper.List.mjs"]
