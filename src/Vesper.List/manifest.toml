[core]
name = "Vesper.List"
description = "The immutable cons-list type and the List module."

# Tracks what `list.fs` needs to BUILD, not every type the contract names: `GetSlice`
# in `list.fsi` names `int option` but has no impl here.
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order.
files = [
    "list.fsi",
]

# Target-NEUTRAL: the verbatim `[]`/`::` cons-list, no inline IL and no BCL name.
# `seq<'T>` is a capability, so `interface seq<'T>` needs no per-target impl either.
impl = [
    "list.fs",
]

[targets.js]
# JS runtime *asset*, shipped beside a consumer's output: the `List` module functions
# plus lifted member accessors (`List__get_Length`, …). GENERATED from `list.fs` — do
# not hand-edit; the codegen-js test suite regenerates and diffs it.
runtime = ["Vesper.List.mjs"]
