[core]
name = "Vesper.List"
namespace = "Vesper.Collections"
description = "The immutable cons-list type and the List module."

# `Vesper.Core` alone, though the `list.fsi` contract also names `int option` (in
# `List.GetSlice`): the compiled impl (`list.fs`) does not, so `depends-on` tracks
# the BUILD dependency only. Vesper.Option returns here if `GetSlice` is implemented.
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "list.fsi",
]

# Runtime impl `.fs` files (our-backend target source). `list.fs` is the compiled
# impl in the verbatim `[]`/`::` operator-case form — the cutover target that the
# old `list-min.fs` (named `Nil`/`Cons` cases) was a placeholder for, now buildable
# because the front end lowers cons patterns/construction (vesper-lib-test-plan
# "list.fs cutover"). `list-min.fs` was removed once the cutover landed.
impl = [
    "list.fs",
]

# JS-target impl override, selected by the
# backend via `ReferencedProject.resolveImpl (Some "js")`. `list.js.fs` is the
# subset of `list.fs` the JS backend can compile (the cons-list type's cases without
# member methods + the `isEmpty`/`length`/`head`/`tail`/`map`/`append`/`rev` module
# functions, `head`/`tail` raising via `failwith`); compiled in library
# mode it GENERATES the `runtime-js` `Vesper.List.mjs` below, replacing the
# hand-authored asset. The CLR backend keeps building the full `list.fs` (base `impl`).
impl-js = [
    "list.js.fs",
]

# JS-target inline-body source. Without this, `resolveInlineBodies (Some "js")` falls
# back to the base `inline-bodies` (= `impl` = `list.fs`), whose `toSeq` leg pulls in
# `System.Collections.Generic.IEnumerable<_>` — unresolvable under a BCL-free JS
# provider. `list.js.fs` is the metadata-free subset, so
# the JS inline-body analysis stays self-contained.
inline-bodies-js = [
    "list.js.fs",
]

# JS runtime *asset*: the cons-list module functions
# (`List.length`/`map`/…) the JS backend imports and ships beside its output, read
# via `ReferencedProject.runtimeModules`. GENERATED from `list.js.fs` (Phase 3) by
# the JS backend, not hand-authored; regenerable via the codegen-js test suite. See
# Vesper.Core's `runtime-js` note for the platform-support-asset pattern.
runtime-js = ["Vesper.List.mjs"]
