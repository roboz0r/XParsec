[core]
name = "Vesper.List"
description = "The immutable cons-list type and the List module."

# `Vesper.Core` alone, though the `list.fsi` contract also names `int option` (in
# `List.GetSlice`): the compiled impl (`list.fs`) does not, so `depends-on` tracks
# the BUILD dependency only. Vesper.Option returns here if `GetSlice` is implemented.
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "list.fsi",
]

# Target-NEUTRAL: the verbatim `[]`/`::` operator-case cons-list, no inline IL and no
# BCL name. `seq` is a CAPABILITY, not a BCL binding — an interface on CLR, an emitted
# `[Symbol.iterator]` on JS — so `interface seq<'T>` and `toSeq`/`ofSeq` bind this file
# to neither target.
impl = [
    "list.fs",
]

[targets.js]
# JS runtime *asset*: the cons-list module functions (`List.length`/`map`/…) and the
# type's lifted member accessors the JS backend imports and ships beside its output.
# GENERATED from `list.fs`, not hand-authored; regenerable via the codegen-js test suite.
runtime = ["Vesper.List.mjs"]
