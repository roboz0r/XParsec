[core]
name = "Vesper.Set"
description = "The immutable AVL-tree set type and the Set module (FSharp.Core verbatim)."

depends-on = ["Vesper.Core", "Vesper.List", "Vesper.Array", "Vesper.Seq", "Vesper.Choice", "Vesper.Option", "Vesper.Comparison", "Vesper.Printf"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "set.fsi",
]

[targets.clr]
# CLR-bound: `System.Collections{,.Generic}` and `System.Text`. No JS body ships yet.
impl = [
    "set.clr.fs",
]
