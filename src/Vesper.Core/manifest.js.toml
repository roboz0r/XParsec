[core]
description = "Minimal language fundamentals: the primitive types, Fun, Ref, capabilities, and the operators."

# One list, in compile order, each `.fsi` contract immediately ahead of its `.fs` body. The
# `.fs` halves are the JS bodies: platform reprs and spliced operator templates. There is no
# whole-package JS build (the runtime is the committed `Vesper.Core.mjs`), so most entries are
# read as splice source, not compiled.
#
# decimal / nativeint / nd-array are ABSENT: JS has no such types, so their contracts are not
# declared here. `decimal` / `nativeint` / `unativeint` stay language-known keys, and a js
# program writing one is rejected as unsupported on the target. And `fun-adapters` is CLR-only:
# JS applies function values directly.
files = [
    # `checkedDivisor` leads: the primitive `.fs` bodies below splice it into their `/` and
    # `%` templates, and it references no type at all.
    "js-interop.js.fsi",
    "js-interop.js.fs",
    "prim-types-min.fsi",
    "prim-types-min.js.fs",
    "capabilities.fsi",
    # JS has iteration but no interfaces, so these bind a `!`-prefixed repr that names nothing
    # at runtime. `!` is illegal in a JS identifier, so it can never collide with a global.
    "capabilities.js.fs",
    "prim-types-array.fsi",
    "prim-types-array.fs",
    "prim-types-int.fsi",
    "prim-types-int.js.fs",
    "prim-types-float.fsi",
    "prim-types-float.js.fs",
    "prim-types-string.fsi",
    "prim-types-string.js.fs",
    "prim-types-object.fsi",
    "prim-types-object.js.fs",
    "prim-types-exn.fsi",
    "prim-types-exn.js.fs",
    "prim-types-bigint.fsi",
    "prim-types-bigint.js.fs",
    "prim-types-attr.fsi",
    # The same `!` repr: JS reifies no attributes, but `Attribute` is still the root every
    # marker below inherits, and a base with a repr is what makes those markers erase at emit.
    "prim-types-attr.js.fs",
    "language-primitives.fsi",
    "language-primitives.fs",
    # `AttributeTargets`, `AttributeUsage`, `Sealed` and `AutoOpen`: what `ops-bitwise`
    # writes, so every other `[<AttributeUsage>]` mask can be written with `|||`.
    "compiler-attributes-core.fsi",
    "compiler-attributes-core.fs",
    "ops-bitwise.fsi",
    "ops-bitwise.fs",
    "compiler-attributes.fsi",
    "compiler-attributes.fs",
    # After `compiler-attributes`, which declares the `[<Measure>]` these write on a type
    # parameter. Each claims a numeric primitive a second time, at arity 1. decimal and
    # nativeint are absent for the same reason their arity-0 contracts are.
    "prim-types-int-measured.fsi",
    "prim-types-int-measured.fs",
    "prim-types-float-measured.fsi",
    "prim-types-float-measured.fs",
    "compiler-markers.fsi",
    "compiler-markers.fs",
    "core-types.fsi",
    "core-types.fs",
    "structural-format.fsi",
    "structural-format.fs",
    # `structuralEquals` / `structuralHash` — `[<Import>]`-attributed bindings served by
    # `Vesper.Core.mjs`. Before `ops-platform`, whose `=` / `hash` bodies splice them.
    "ops-platform-runtime.js.fsi",
    "ops-platform-runtime.js.fs",
    "ops-platform.fsi",
    "ops-platform.js.fs",
    "ops-std.fsi",
    "ops-std.fs",
    "int-comparison.fsi",
    "int-comparison.js.fs",
    # The compat shim maps the BCL interface spellings to the BCL-free capabilities, so it
    # comes after `capabilities.fsi` — its RHS (`Vesper.disposable`) must already be in the
    # registry.
    "capabilities-compat.js.fsi",
    "capabilities-compat.js.fs",
    # `null` needs no counterpart entry — it is a reserved keyword, already distinct.
    "prim-types-undefined.js.fsi",
    "prim-types-undefined.js.fs",
    # JS-only opaque `dynamic` intrinsic type — the F#-side landing point for TS `any`.
    "prim-types-dynamic.js.fsi",
    "prim-types-dynamic.js.fs",
    # After `prim-types-dynamic.js.fsi` — these operators reference the `dynamic` type.
    "ops-dynamic.js.fsi",
    "ops-dynamic.js.fs",
    # The BCL exception roots as `namespace System` contract types. JS-only: the CLR resolves
    # these names through `System.Private.CoreLib`, and declaring them there would shadow the
    # real types in a `newobj`. After `prim-types-exn.fsi` — each inherits `exn`.
    "exceptions.js.fsi",
    "exceptions.js.fs",
    # Last: `[<assembly: AutoOpen>]` names `AutoOpenAttribute`, declared in
    # `compiler-attributes`. The prelude it declares holds over every file above it.
    "assembly-info.fsi",
    "assembly-info.fs",
]

# The package's committed JS output, behind the generated `Vesper.Core/index.mjs` barrel.
# `Vesper.Core.mjs` leads and is hand-authored, so it is also the RUNTIME ENTRY a synthesised
# import resolves to: `structuralEquals` / `structuralHash` / `enumeratorOf`.
# `exceptions.mjs` is GENERATED from `exceptions.js.fs`, regenerable via the codegen-js suite.
runtime = ["Vesper.Core.mjs", "exceptions.mjs"]
