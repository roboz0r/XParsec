[core]
description = "Minimal language fundamentals: the primitive types, Fun, Ref, capabilities, and the operators."

files = [
    "prim-types-min.fsi",
    "capabilities.fsi",
    "prim-types-array.fsi",
    "prim-types-int.fsi",
    "prim-types-float.fsi",
    "prim-types-string.fsi",
    "prim-types-object.fsi",
    "prim-types-exn.fsi",
    "prim-types-decimal.fsi",
    "prim-types-bigint.fsi",
    "prim-types-nativeint.fsi",
    "prim-types-nd-array.fsi",
    "prim-types-attr.fsi",
    "compiler-attributes.fsi",
    "core-types.fsi",
    "structural-format.fsi",
    "ops-platform.fsi",
    "ops-std.fsi",
    "int-comparison.fsi",
    # The compat shim maps the BCL interface spellings to the BCL-free capabilities, so it
    # comes after `capabilities.fsi` — its RHS (`Vesper.disposable`) must already be in the
    # registry.
    "capabilities-compat.js.fsi",
    # `structuralEquals` / `structuralHash` — declarations only; the bodies are in
    # `Vesper.Core.mjs`. The CLR `=`/`<>`/`hash` use `EqualityComparer` instead.
    "ops-platform-runtime.js.fsi",
    # `null` needs no counterpart entry — it is a reserved keyword, already distinct.
    "prim-types-undefined.js.fsi",
    # JS-only opaque `dynamic` intrinsic type — the F#-side landing point for TS `any`.
    "prim-types-dynamic.js.fsi",
    # After `prim-types-dynamic.js.fsi` — these operators reference the `dynamic` type.
    "ops-dynamic.js.fsi",
    # The BCL exception roots as `namespace System` contract types. JS-only: the CLR resolves
    # these names through `System.Private.CoreLib`, and declaring them there would shadow the
    # real types in a `newobj`. After `prim-types-exn.fsi` — each inherits `exn`.
    "exceptions.js.fsi",
]

# All 9 attribute types are fully ERASED on JS — no `.mjs` residue, no decorator — but must
# stay RESOLVABLE: `core-types.fs` below carries `[<ReferenceEquality>]`/`[<NoComparison>]`.
sig-only = [
    "compiler-attributes.fsi",
    # Impl-free: the mechanism comes via `prim-types-exn`, which erases every root to `Error`.
    "exceptions.js.fsi",
]

# The JS bodies: platform reprs and spliced operator templates. There is no whole-package JS
# build (the runtime is the committed `Vesper.Core.mjs`), so most entries are read as splice
# source, not compiled. nativeint / decimal / nd-array / attr / capabilities have no JS body.
impl = [
    "prim-types-min.js.fs",
    "prim-types-array.fs",
    "prim-types-int.js.fs",
    "prim-types-float.js.fs",
    "prim-types-string.js.fs",
    "prim-types-object.js.fs",
    "prim-types-exn.js.fs",
    "prim-types-bigint.js.fs",
    "core-types.fs",
    "structural-format.fs",
    "ops-platform.js.fs",
    "ops-std.fs",
    "int-comparison.js.fs",
    "prim-types-undefined.js.fs",
    "prim-types-dynamic.js.fs",
    "ops-dynamic.js.fs",
]

# Hand-authored runtime asset, not a parsed source: the JS backend imports
# `structuralEquals` / `structuralHash` / `checkedDivisor` / `enumeratorOf` from it and
# ships it beside the output.
runtime = ["Vesper.Core.mjs"]
