[core]
description = "Minimal language fundamentals: the primitive types, Fun, Ref, capabilities, and the operators."

# One list, in compile order, each `.fsi` contract immediately ahead of its `.fs` body. The
# `.fs` halves are compiled into Vesper.Core.dll AND published as the CLR splice sources. The
# intrinsic-only `prim-types-*` / `capabilities` files emit NO IL: they register a
# representation, not a TypeDef, so a `(# … #)` body reaches a use site only by being spliced.
files = [
    "prim-types-min.fsi",
    "prim-types-min.clr.fs",
    "capabilities.fsi",
    "capabilities.clr.fs",
    "prim-types-array.fsi",
    "prim-types-array.fs",
    "prim-types-int.fsi",
    "prim-types-int.clr.fs",
    "prim-types-float.fsi",
    "prim-types-float.clr.fs",
    "prim-types-string.fsi",
    "prim-types-string.clr.fs",
    "prim-types-object.fsi",
    "prim-types-object.clr.fs",
    "prim-types-exn.fsi",
    "prim-types-exn.clr.fs",
    "prim-types-decimal.fsi",
    "prim-types-decimal.clr.fs",
    "prim-types-bigint.fsi",
    "prim-types-bigint.clr.fs",
    "prim-types-nativeint.fsi",
    "prim-types-nativeint.clr.fs",
    "prim-types-nd-array.fsi",
    "prim-types-nd-array.clr.fs",
    "prim-types-attr.fsi",
    "prim-types-attr.clr.fs",
    "language-primitives.fsi",
    "language-primitives.fs",
    # `AttributeTargets`, `AttributeUsage`, `Sealed` and `AutoOpen`: what `ops-bitwise`
    # writes, so every other `[<AttributeUsage>]` mask can be written with `|||`.
    "compiler-attributes-core.fsi",
    "compiler-attributes-core.fs",
    "ops-bitwise.fsi",
    "ops-bitwise.fs",
    "compiler-attributes.fsi",
    "compiler-attributes.fs",
    # After `compiler-attributes`, which declares the `[<Measure>]` these write on a type
    # parameter. Each claims a numeric primitive a second time, at arity 1.
    "prim-types-int-measured.fsi",
    "prim-types-int-measured.fs",
    "prim-types-float-measured.fsi",
    "prim-types-float-measured.fs",
    "prim-types-decimal-measured.fsi",
    "prim-types-decimal-measured.fs",
    "prim-types-nativeint-measured.fsi",
    "prim-types-nativeint-measured.fs",
    "compiler-markers.fsi",
    "compiler-markers.fs",
    # `reflect` is CLR-only: JS has no runtime representation of a type.
    "reflect.fsi",
    "reflect.clr.fs",
    "core-types.fsi",
    "core-types.fs",
    # `fun-adapters` is CLR-only: a CLR function value is a nominal `Fun` interface, so
    # adapting flat<->curried needs a reified object.
    "fun-adapters.fsi",
    "fun-adapters.fs",
    "structural-format.fsi",
    "structural-format.fs",
    "ops-platform.fsi",
    "ops-platform.clr.fs",
    "ops-std.fsi",
    "ops-std.fs",
    "int-comparison.fsi",
    "int-comparison.clr.fs",
    # Last: `[<assembly: AutoOpen>]` names `AutoOpenAttribute`, declared in
    # `compiler-attributes`. The prelude it declares holds over every file above it.
    "assembly-info.fsi",
    "assembly-info.fs",
]
