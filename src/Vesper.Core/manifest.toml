[core]
description = "Minimal language fundamentals: the primitive types, Fun, Ref, capabilities, and the operators."

# Declaration order, top-down as F# resolves: `prim-types-min` first (int/bool/unit/`Fun`),
# then `capabilities`, then `prim-types-array` — the array declares the `seq` capability, so
# both must already be in scope. `core-types` before the operator files.
files = [
    "prim-types-min.fsi",
    "capabilities.fsi",
    "prim-types-array.fsi",
    "prim-types-int.fsi",
    "prim-types-float.fsi",
    "prim-types-string.fsi",
    "prim-types-object.fsi",
    "prim-types-exn.fsi",
    "prim-types-decimal.fsi",
    "prim-types-bigint.fsi",
    "prim-types-nativeint.fsi",
    "prim-types-nd-array.fsi",
    "prim-types-attr.fsi",
    "compiler-attributes.fsi",
    "core-types.fsi",
    "structural-format.fsi",
    "ops-platform.fsi",
    "ops-std.fsi",
    "int-comparison.fsi",
]

# The target-neutral bodies (`core-types`, `structural-format`, `ops-std`) are listed per
# target, not shared: a shared `impl` would append BEFORE each target's list, ahead of the
# `Fun` and `Attribute` declarations those bodies need.

[targets.clr]
# CLR-only: a CLR function value is a nominal `Fun` interface, so adapting flat<->curried
# needs a reified object.
files = [
    "fun-adapters.fsi",
]

# Compiled into Vesper.Core.dll AND published as the CLR splice sources. The intrinsic-only
# `prim-types-*` / `capabilities` files emit NO IL: they register a representation, not a
# TypeDef, so a `(# … #)` body reaches a use site only by being spliced.
impl = [
    "prim-types-min.clr.fs",
    "capabilities.clr.fs",
    "prim-types-array.fs",
    "prim-types-int.clr.fs",
    "prim-types-float.clr.fs",
    "prim-types-string.clr.fs",
    "prim-types-object.clr.fs",
    "prim-types-exn.clr.fs",
    "prim-types-decimal.clr.fs",
    "prim-types-bigint.clr.fs",
    "prim-types-nativeint.clr.fs",
    "prim-types-nd-array.clr.fs",
    "prim-types-attr.clr.fs",
    "compiler-attributes.fs",
    "core-types.fs",
    "fun-adapters.fs",
    "structural-format.fs",
    "ops-platform.clr.fs",
    "ops-std.fs",
    "int-comparison.clr.fs",
]

[targets.js]
# JS-only EXTRA contracts, appended after `[core] files`. The compat shim maps the BCL
# interface spellings to the BCL-free capabilities, so it comes after `capabilities.fsi`
# — its RHS (`Vesper.disposable`) must already be in the registry.
files = [
    "capabilities-compat.js.fsi",
    # `structuralEquals` / `structuralHash` — declarations only; the bodies are in
    # `Vesper.Core.mjs`. The CLR `=`/`<>`/`hash` use `EqualityComparer` instead.
    "ops-platform-runtime.js.fsi",
    # `null` needs no counterpart entry — it is a reserved keyword, already distinct.
    "prim-types-undefined.js.fsi",
    # JS-only opaque `dynamic` intrinsic type — the F#-side landing point for TS `any`.
    "prim-types-dynamic.js.fsi",
    # After `prim-types-dynamic.js.fsi` — these operators reference the `dynamic` type.
    "ops-dynamic.js.fsi",
    # A `get_Item` indexer on the intrinsic array. Declared in the GLOBAL namespace so this
    # member host cannot displace the `Vesper` shape carrying the array's capabilities.
    "array-index.js.fsi",
]

# All 9 attribute types are fully ERASED on JS — no `.mjs` residue, no decorator — but must
# stay RESOLVABLE: `core-types.fs` below carries `[<ReferenceEquality>]`/`[<NoComparison>]`.
sig-only = [
    "compiler-attributes.fsi",
]

# The JS bodies: platform reprs and spliced operator templates. There is no whole-package JS
# build (the runtime is the committed `Vesper.Core.mjs`), so most entries are read as splice
# source, not compiled. nativeint / decimal / nd-array / attr / capabilities have no JS body.
impl = [
    "prim-types-min.js.fs",
    "prim-types-array.fs",
    "prim-types-int.js.fs",
    "prim-types-float.js.fs",
    "prim-types-string.js.fs",
    "prim-types-object.js.fs",
    "prim-types-exn.js.fs",
    "prim-types-bigint.js.fs",
    "core-types.fs",
    "structural-format.fs",
    "ops-platform.js.fs",
    "ops-std.fs",
    "int-comparison.js.fs",
    "prim-types-undefined.js.fs",
    "prim-types-dynamic.js.fs",
    "ops-dynamic.js.fs",
    # The array `get_Item` body — lifted `this`-first and served under the member key, so
    # `arr.[i]` splices the same `ldelem` the free `GetArray` does.
    "array-index.js.fs",
]

# Hand-authored runtime asset, not a parsed source: the JS backend imports
# `structuralEquals` / `structuralHash` / `checkedDivisor` / `enumeratorOf` from it and
# ships it beside the output.
runtime = ["Vesper.Core.mjs"]
