[core]
description = "Minimal language fundamentals: the primitive types, Fun, Ref, capabilities, and the operators."

# .fsi files in compile order — fed to the parser one at a time, accumulating
# declarations. prim-types-min first (defines int/bool/array/`Fun`/`unit`);
# core-types before the operator files; everything else depends only on the
# BCL primitives. `List.fold`'s arrow signature desugars to `Vesper.Fun`.
files = [
    "prim-types-min.fsi",
    "prim-types-int.fsi",
    "prim-types-float.fsi",
    "prim-types-string.fsi",
    "prim-types-object.fsi",
    "prim-types-exn.fsi",
    "prim-types-decimal.fsi",
    "prim-types-bigint.fsi",
    "prim-types-nativeint.fsi",
    "prim-types-nd-array.fsi",
    "prim-types-attr.fsi",
    "compiler-attributes.fsi",
    "core-types.fsi",
    "capabilities.fsi",
    "structural-format.fsi",
    "ops-platform.fsi",
    "ops-std.fsi",
    "int-comparison.fsi",
]

# NO shared `impl`, though four of these bodies are target-neutral
# (`compiler-attributes`, `core-types`, `structural-format`, `ops-std`). A single-package
# compile is DECLARATION-ordered: `core-types` needs `Fun` from `prim-types-min` and
# `[<ReferenceEquality>]` from `compiler-attributes`, which needs `Attribute` from
# `prim-types-attr`. Inherited lists append AFTER the shared ones, so a shared list here
# would put the neutral bodies first and break that chain. Each target therefore names the
# whole sequence, in `files` order.

[targets.clr]
# Compiled into Vesper.Core.dll AND published as the CLR splice sources, in `files` order.
# The intrinsic-only `prim-types-*` / `capabilities` files emit NO IL: they register the
# per-target representation (the provider extraction), not a TypeDef. They still carry the
# operator members declared on the primitives — a member on an intrinsic has no type to hang
# a method on, so its `(# … #)` body reaches a use site only by being spliced.
impl = [
    "prim-types-min.fs",
    "prim-types-int.fs",
    "prim-types-float.fs",
    "prim-types-string.fs",
    "prim-types-object.fs",
    "prim-types-exn.fs",
    "prim-types-decimal.fs",
    "prim-types-bigint.fs",
    "prim-types-nativeint.fs",
    "prim-types-nd-array.fs",
    "prim-types-attr.fs",
    "compiler-attributes.fs",
    "core-types.fs",
    "capabilities.fs",
    "structural-format.fs",
    "ops-platform.fs",
    "ops-std.fs",
    "int-comparison.fs",
]

[targets.js]
# JS-only EXTRA contracts, appended after `[core] files`. The capability compat shim maps
# the BCL interface spellings to the canonical BCL-free capabilities so ported source
# resolves on JS; extracted after `capabilities.fsi` so its RHS (`Vesper.disposable`) is
# already in the registry.
files = [
    "capabilities-compat.js.fsi",
    # JS-only equality runtime entries (`structuralEquals`/`structuralHash`). Not in the
    # shared contract — they have no CLR `.fs` body (CLR `=`/`<>`/`hash` use
    # `EqualityComparer` inline); the JS `=`/`<>`/`hash` aggregate arms delegate to them,
    # bodies in `Vesper.Core.mjs`.
    "ops-platform-runtime.js.fsi",
    # JS-only absence-sentinel intrinsic type `undefined` — a distinct identity from
    # `unit`, no CLR analog. (`null` is NOT declared here: it is a reserved keyword and
    # already distinct without an entry.)
    "prim-types-undefined.js.fsi",
    # JS-only opaque `dynamic` intrinsic type — the F#-side landing point for TS `any`.
    "prim-types-dynamic.js.fsi",
    # The `dynamic` operators — `retype`/`dynamic` (enter) and `(?)`/`(?<-)` (member
    # access, target-typed via `default ^TResult : dynamic`). Extracted after the
    # `dynamic` type it references.
    "ops-dynamic.js.fsi",
    # JS-only augmentation of the intrinsic array `'T[]` with a `get_Item` indexer
    # accessor. Declared in the GLOBAL namespace so its member-contract key is bare — the
    # array's canonical bare `TyConst` identity, spelled `` ``[]`` ``
    # (RuntimeNames.arrayContractName) — matching the receiver-side lookup and the
    # inline-body store. A SEPARATE contract entry from `prim-types-min.fsi`'s
    # `type 'T[] = extern`, which stays the `Vesper.``[]``` `Intrinsic` shape untouched.
    "array-index.js.fsi",
]

# The JS bodies: the platform reprs and the spliced operator templates. No JS library build
# of Vesper.Core exists yet (the JS runtime is the committed `Vesper.Core.mjs` asset), so
# nothing here is compiled today — the list is read as the splice source and as the
# intrinsic-repr binding. `ops-std.fs` is the CLR-named neutral file, repeated per target
# rather than shared, for the declaration-order reason in the `[core]` comment.
# There is no `prim-types-nativeint.js.fs`: JS has no nativeint repr, so
# the type is unrepresentable there and its operator declarations are unreachable rather
# than separately gated. Likewise decimal / nd-array / attr / capabilities ship no JS body
# — they stay `Intrinsic` with no platform name.
impl = [
    "prim-types-min.js.fs",
    "prim-types-int.js.fs",
    "prim-types-float.js.fs",
    "prim-types-string.js.fs",
    "prim-types-object.js.fs",
    "prim-types-exn.js.fs",
    "prim-types-bigint.js.fs",
    "ops-platform.js.fs",
    "ops-std.fs",
    # The `undefined` VALUE (`let undefined = (# "undefined" #)`) — a zero-operand
    # intrinsic the JS backend treats as a compile-time alias (spliced at each use, no
    # `const undefined = undefined` definition).
    "prim-types-undefined.js.fs",
    # The `dynamic` type's `(# "any" #)` repr — marker and platform face in one file.
    "prim-types-dynamic.js.fs",
    # The `dynamic` operator bodies (`retype`/`dynamic`/`(?)`/`(?<-)`) — JS-only
    # (`$0[$1]` computed-member templates), spliced at each `?` use site.
    "ops-dynamic.js.fs",
    # The array `get_Item` member body — lifted `this`-first and served under the
    # finalized member key so `arr.[i]` splices the `ldelem` exactly as the free
    # `GetArray` did. Companion of `array-index.js.fsi`; deliberately a DIFFERENT base
    # name so the intrinsic-repr extraction never treats it as the array's platform repr.
    "array-index-body.js.fs",
]

# Hand-authored JS runtime *asset*: the structural core (`equals` / `structuralHash`) the
# JS backend imports and ships beside its output — the platform-support analogue of
# Vesper.Printf's committed DLL. NOT a parsed source (a `.mjs`, not an `.fsi`/`.fs`).
# Route B (the `--compiling-fslib` bootstrap) later generates this same module from
# Vesper source.
runtime = ["Vesper.Core.mjs"]
