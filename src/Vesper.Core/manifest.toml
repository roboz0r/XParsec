[core]
description = "Minimal language fundamentals: the primitive types, Fun, Ref, capabilities, and the operators."

# .fsi files in compile order — fed to the parser one at a time, accumulating
# declarations. prim-types-min first (defines int/bool/array/`Fun`/`unit`);
# core-types before the operator files; everything else depends only on the
# BCL primitives. `List.fold`'s arrow signature desugars to `Vesper.Fun`.
files = [
    "prim-types-min.fsi",
    "prim-types-int.fsi",
    "prim-types-float.fsi",
    "prim-types-string.fsi",
    "prim-types-object.fsi",
    "prim-types-exn.fsi",
    "prim-types-decimal.fsi",
    "prim-types-bigint.fsi",
    "prim-types-nativeint.fsi",
    "prim-types-nd-array.fsi",
    "prim-types-attr.fsi",
    "compiler-attributes.fsi",
    "core-types.fsi",
    "capabilities.fsi",
    "structural-format.fsi",
    "ops-platform.fsi",
    "ops-std.fsi",
    "int-comparison.fsi",
]

# JS-only EXTRA contract files, APPENDED to `files` for the JS target by
# `ReferencedProject.resolveExtraFiles` (append, unlike `impl-js`'s REPLACE). The
# capability compat shim maps the BCL interface spellings to the canonical BCL-free
# capabilities so ported source resolves on JS. Extracted after `capabilities.fsi` so
# its RHS (`Vesper.disposable`) is already in the registry.
files-js = [
    "capabilities-compat.js.fsi",
    # JS-only equality runtime entries (`structuralEquals`/`structuralHash`). Not in the
    # CLR contract — they have no CLR `.fs` body (CLR `=`/`<>`/`hash` use `EqualityComparer`
    # inline); the JS `=`/`<>`/`hash` aggregate arms delegate to them, bodies in
    # `Vesper.Core.mjs`. Appended after `capabilities-compat` (no dependency on it).
    "ops-platform-runtime.js.fsi",
    # JS-only absence-sentinel intrinsic type `undefined` — a distinct identity from
    # `unit`, no CLR analog (so never in base `files`). Its `.js.fs` companion is
    # extracted as BOTH marker and platform face (no base/override split). (`null` is
    # NOT declared here: it is a reserved keyword and already distinct without an entry.)
    "prim-types-undefined.js.fsi",
    # JS-only opaque `dynamic` intrinsic type — the F#-side landing point for TS `any`,
    # no CLR analog. Extracted (marker + `"any"` platform face) exactly like `undefined`.
    "prim-types-dynamic.js.fsi",
    # The `dynamic` operators — `retype`/`dynamic` (enter) and `(?)`/`(?<-)` (member
    # access, target-typed via `default ^TResult : dynamic`). Bodies in `ops-dynamic.js.fs`
    # (`inline-bodies-js`). Extracted after the `dynamic` type it references.
    "ops-dynamic.js.fsi",
    # JS-only augmentation of the intrinsic array `'T[]` with a `get_Item` indexer
    # accessor (W9 array-index READ migration). Declared in the GLOBAL namespace so its
    # member-contract key is bare — the array's canonical bare `TyConst` identity, spelled
    # `` ``[]`` `` (RuntimeNames.arrayContractName) — matching the receiver-side lookup and
    # the inline-body store. A SEPARATE contract entry from `prim-types-min.fsi`'s
    # `type 'T[] = extern`, which stays the `Vesper.``[]``` `Intrinsic` shape untouched.
    # Its `.js.fs` body source is
    # `array-index-body.js.fs` (deliberately a DIFFERENT base name so the intrinsic-repr
    # companion extraction never treats it as the array's platform repr).
    "array-index.js.fsi",
]

# Every `.fs` in the package is listed here (one source of truth, no orphaned
# `.fs`). The intrinsic-only `prim-types-*.fs` / `capabilities.fs` bind
# `(# "..." #)` reprs and emit NO IL: they register the per-target representation
# (channel-1 / the provider extraction), not a TypeDef. The actual emitted members are
# `Fun`/`Fun2` + the primitive array/`unit` (prim-types-min), the captured-mutable
# `Ref` (core-types), and the `%A` interfaces (structural-format). Order mirrors the
# `.fsi` `files` order above. The inline-only operator bodies (`ops-*`,
# `int-comparison`) stay in `inline-bodies`, not here.
impl = [
    "prim-types-min.fs",
    "prim-types-int.fs",
    "prim-types-float.fs",
    "prim-types-string.fs",
    "prim-types-object.fs",
    "prim-types-exn.fs",
    "prim-types-decimal.fs",
    "prim-types-bigint.fs",
    "prim-types-nativeint.fs",
    "prim-types-nd-array.fs",
    "prim-types-attr.fs",
    "compiler-attributes.fs",
    "core-types.fs",
    "capabilities.fs",
    "structural-format.fs",
]

# Per-target `.fs` bodies the codegen inline-body loader reads across the package
# boundary. `ops-platform.fs` carries the
# operator + `hash` inline bodies (the equality / arithmetic / bitwise / unary
# families); `ops-std.fs` carries the logical (`&&`/`||`, short-circuit via the
# inliner's conditional-branch substitution) + composition / pipe operators. These
# are signature-only (`let inline` spliced at the use site, no emitted method), so
# they are NOT a DLL compile target — distinct from `impl`.
inline-bodies = [
    # Also in `impl`, and necessarily in both: it BINDS the primitive reprs (impl) and
    # CARRIES the operator members declared on them, whose `(# … #)` bodies are splice
    # templates served by member key. A member on an intrinsic is never emitted — the
    # primitive has no type to hang a method on — so the body can only reach a use site
    # through this list.
    "prim-types-min.fs",
    "prim-types-int.fs",
    "prim-types-float.fs",
    "prim-types-string.fs",
    "prim-types-decimal.fs",
    "prim-types-bigint.fs",
    "prim-types-nativeint.fs",
    "ops-platform.fs",
    "ops-std.fs",
    "int-comparison.fs",
]

# JS-target override, selected by the backend via
# `ReferencedProject.resolveInlineBodies (Some "js")`. The override REPLACES the
# whole list, so the target-neutral `ops-std.fs` (logical/composition/pipe — pure
# F#, no platform IL) is repeated unchanged; only `ops-platform.fs` diverges to
# its `$N`-template sibling `ops-platform.js.fs`.
inline-bodies-js = [
    # The JS half of the primitives' operator member bodies — see the base list. There is
    # no `prim-types-nativeint.js.fs`: JS has no nativeint repr, so the type is
    # unrepresentable there and its operator declarations are unreachable rather than
    # separately gated.
    "prim-types-min.js.fs",
    "prim-types-int.js.fs",
    "prim-types-float.js.fs",
    "prim-types-string.js.fs",
    "prim-types-bigint.js.fs",
    "ops-platform.js.fs",
    "ops-std.fs",
    # The `undefined` VALUE (`let undefined = (# "undefined" #)`) — a zero-operand
    # intrinsic the JS backend treats as a compile-time alias (spliced at each use,
    # no `const undefined = undefined` definition). Its `.js.fsi` `val` is the contract;
    # this `.js.fs` body is served cross-package as the splice source.
    "prim-types-undefined.js.fs",
    # The `dynamic` operator bodies (`retype`/`dynamic`/`(?)`/`(?<-)`) — JS-only
    # (`$0[$1]` computed-member templates), spliced at each `?` use site.
    "ops-dynamic.js.fs",
    # The array `get_Item` member body — lifted `this`-first (`liftMemberBody`)
    # and served under the finalized member key so `arr.[i]` splices the `ldelem`
    # exactly as the free `GetArray` did. Companion of `array-index.js.fsi`.
    "array-index-body.js.fs",
]

# Hand-authored JS runtime *asset*: the structural
# core (`equals` / `structuralHash`) the JS backend imports and ships beside its
# output — the platform-support analogue of Vesper.Printf's committed DLL, read via
# `ReferencedProject.runtimeModules`. NOT a parsed source (a `.mjs`, not an
# `.fsi`/`.fs`): a runtime asset is inherently target-specific, so there is no base
# `runtime` key. Route B (the `--compiling-fslib` bootstrap) later generates this
# same module from Vesper source.
runtime-js = ["Vesper.Core.mjs"]
