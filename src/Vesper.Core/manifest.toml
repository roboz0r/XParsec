# Vesper.Core — minimal self-hosted core library.
#
# Authored (NOT a port): this tree is original, so there is no `[upstream]` pin
# (cf. XParsec.FSharp.Lib's manifest, which records the FSharp.Core SHA it was
# transliterated from).
#
# The `.fsi` files are the front-end symbol contract — parsed by XParsec.FSharp
# and walked into an `IExternalSymbolProvider`. The `.fs` files are the runtime
# implementation target for this repo's own backend (→ Vesper.Core.dll,
# BCL-only, no FSharp.Core). Like XParsec.FSharp.Lib there is no `.fsproj`: the
# operators alone force the contract to be signature-only (a `let inline (+)`
# body needs inline IL / `--compiling-fslib`).
#
# NOTE (2026-05-24): the operator/`hash` IMPLEMENTATIONS do not exist as `.fs`
# yet — there is no `ops-platform.fs`. The only `.fs` here are `prim-types-min.fs`
# + `prim-types-string.fs` (built into Vesper.Core.dll). The live `=`/`<>`/
# arithmetic and `hash` semantics are emitted by codegen-side stopgaps
# (`Emit.BuiltinOps` op→opcode table + `Emit.isHash`), NOT read from source.
# Writing the real `ops-platform.fs` is blocked on two front-end gaps: operator-
# named bindings don't freeze, and there is no BCL generic-member resolution for
# the `EqualityComparer<'T>` fall-clauses. See
# ../XParsec.FSharp.SemanticAnalysis/docs/core-operators-handoff.md.
#
# See ./README.md and ../XParsec.FSharp.SemanticAnalysis/docs/minimal-core-lib-plan.md.

[core]
namespace = "Vesper"
description = "Minimal language fundamentals: unit, IFunc, cons-list, operators."

# .fsi files in compile order — fed to the parser one at a time, accumulating
# declarations. prim-types-min first (defines int/bool/array/`Fun`/`unit`);
# core-types before the operator files; everything else depends only on the
# BCL primitives. `List.fold`'s arrow signature desugars to `Vesper.Fun`.
files = [
    "prim-types-min.fsi",
    "prim-types-int.fsi",
    "prim-types-float.fsi",
    "prim-types-string.fsi",
    "prim-types-object.fsi",
    "prim-types-exn.fsi",
    "prim-types-decimal.fsi",
    "prim-types-nativeint.fsi",
    "prim-types-nd-array.fsi",
    "prim-types-attr.fsi",
    "compiler-attributes.fsi",
    "core-types.fsi",
    "ops-platform.fsi",
    "ops-std.fsi",
]
