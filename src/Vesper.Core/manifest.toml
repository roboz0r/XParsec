# Vesper.Core — minimal self-hosted core library.
#
# Authored (NOT a port): this tree is original, so there is no `[upstream]` pin
# (cf. XParsec.FSharp.Lib's manifest, which records the FSharp.Core SHA it was
# transliterated from).
#
# The `.fsi` files are the front-end symbol contract — parsed by XParsec.FSharp
# and walked into an `IExternalSymbolProvider`. The `.fs` files are the runtime
# implementation target for this repo's own backend (→ Vesper.Core.dll,
# BCL-only, no FSharp.Core). Like XParsec.FSharp.Lib there is no `.fsproj`: the
# operators alone force the contract to be signature-only (a `let inline (+)`
# body needs inline IL / `--compiling-fslib`).
#
# NOTE (2026-05-25): the OPERATOR bodies now live here. `hash`, the equality family
# (`=`/`<>`), and arithmetic/bitwise/unary (`+ - * / %`, `~- ~+`, `&&& ||| ^^^ <<<
# >>> ~~~`) all have real `.fs` bodies in `ops-platform.fs` (listed in `impl` below).
# Codegen reads them across the package boundary via the inline-body loader
# (`SymbolProviders.inlineBodies`) and splices each at its use site — the
# operator-named-binding freeze gap that once blocked this is closed, and the
# `Emit.BuiltinOps` op→opcode table is now only the un-ground / nested / generic
# fallback. See ../XParsec.FSharp.SemanticAnalysis/docs/operators-plan.md
# "Implementation status".
#
# See ./README.md.

[core]
namespace = "Vesper"
description = "Minimal language fundamentals: unit, IFunc, cons-list, operators."

# .fsi files in compile order — fed to the parser one at a time, accumulating
# declarations. prim-types-min first (defines int/bool/array/`Fun`/`unit`);
# core-types before the operator files; everything else depends only on the
# BCL primitives. `List.fold`'s arrow signature desugars to `Vesper.Fun`.
files = [
    "prim-types-min.fsi",
    "prim-types-int.fsi",
    "prim-types-float.fsi",
    "prim-types-string.fsi",
    "prim-types-object.fsi",
    "prim-types-exn.fsi",
    "prim-types-decimal.fsi",
    "prim-types-nativeint.fsi",
    "prim-types-nd-array.fsi",
    "prim-types-attr.fsi",
    "compiler-attributes.fsi",
    "core-types.fsi",
    "structural-format.fsi",
    "ops-platform.fsi",
    "ops-std.fsi",
]

# The `.fs` files compiled into Vesper.Core.dll (the package's runtime DLL). These
# define the extern primitive types bound to `(# "..." #)` intrinsics (`Fun`, `unit`,
# `int`, array, …) and the captured-mutable `Ref` cell — the actual emitted members.
# (Not every `prim-types-*.fs` is listed: the minimal BCL-only DLL is built from
# `prim-types-min.fs` + `core-types.fs`, matching the codegen test fixture.)
impl = [
    "prim-types-min.fs",
    "core-types.fs",
    "structural-format.fs",
]

# Per-target `.fs` bodies the codegen inline-body loader reads across the package
# boundary. `ops-platform.fs` carries the
# operator + `hash` inline bodies (the equality / arithmetic / bitwise / unary
# families); `ops-std.fs` carries the logical (`&&`/`||`, short-circuit via the
# inliner's conditional-branch substitution) + composition / pipe operators. These
# are signature-only (`let inline` spliced at the use site, no emitted method), so
# they are NOT a DLL compile target — distinct from `impl`.
inline-bodies = [
    "ops-platform.fs",
    "ops-std.fs",
]

# JS-target override (codegen-js-steps.md step F1), selected by the backend via
# `ReferencedProject.resolveInlineBodies (Some "js")`. The override REPLACES the
# whole list, so the target-neutral `ops-std.fs` (logical/composition/pipe — pure
# F#, no platform IL) is repeated unchanged; only `ops-platform.fs` diverges to
# its `$N`-template sibling `ops-platform.js.fs`.
inline-bodies-js = [
    "ops-platform.js.fs",
    "ops-std.fs",
]

# Hand-authored JS runtime *asset* (codegen-js-steps.md Step 6): the structural
# core (`equals` / `structuralHash`) the JS backend imports and ships beside its
# output — the platform-support analogue of Vesper.Printf's committed DLL, read via
# `ReferencedProject.runtimeModules`. NOT a parsed source (a `.mjs`, not an
# `.fsi`/`.fs`): a runtime asset is inherently target-specific, so there is no base
# `runtime` key. Route B (the `--compiling-fslib` bootstrap) later generates this
# same module from Vesper source.
runtime-js = ["Vesper.Core.mjs"]
