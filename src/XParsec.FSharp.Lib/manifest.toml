# XParsec.FSharp.Lib — signature-only port of FSharp.Core
#
# Consumed by XParsec.FSharp.SemanticAnalysis as a source of external
# symbols. NOT compiled by the F# compiler; the .fsi files (plus a few
# .fs files where no signature exists) are parsed directly by XParsec.FSharp.
#
# .fs implementation files are kept alongside each .fsi as transliteration
# reference (for upstream re-syncs) but are not listed in the per-bucket
# manifests. Add them to a bucket's manifest only when the type checker
# needs implementation-level information that signatures don't carry.

[upstream]
repository  = "dotnet/fsharp"
commit      = "ff81858ea7eaa4631e1d1ad6aa4f61d7b8967139"
tag         = "v13.9.201-665-gff81858ea"
path        = "D:/roboz0r/fsharp/src/FSharp.Core"

# Bucket order matches the original split (Clr at the bottom; Common
# layered above; Threading / Reflection / Printf as siblings on Common).
# depends-on lists direct dependencies only — consumers compute transitive
# closure.

[[bucket]]
name        = "Clr"
path        = "Clr"
description = "Platform primitives: type aliases (int = Int32), inline IL operator definitions, SRTP/static-optimisation machinery."
depends-on  = []

[[bucket]]
name        = "Common"
path        = "Common"
description = "Target-agnostic core: collections, option/result, events/observable, Random, BigInteger, units of measure."
depends-on  = ["Clr"]

[[bucket]]
name        = "Threading"
path        = "Threading"
description = ".NET-coupled concurrency: async, tasks, resumable, mailbox."
depends-on  = ["Common"]

[[bucket]]
name        = "Reflection"
path        = "Reflection"
description = "F#-aware wrappers over System.Reflection (FSharpType, FSharpValue, etc.)."
depends-on  = ["Common"]

[[bucket]]
name        = "Printf"
path        = "Printf"
description = "printf + sformat. Self-contained text formatting."
depends-on  = ["Common"]
