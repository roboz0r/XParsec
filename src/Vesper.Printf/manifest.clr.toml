[core]
description = "printf / printfn / sprintf and the write-through format handler."

# Vesper.Core for the language primitives (`string`, `uint`, `char[]`, the
# arithmetic/equality operators); Vesper.List for the cons-list the CLR `%A` engine
# uses as its `Doc` child lists and frame stack.
depends-on = ["../Vesper.Core", "../Vesper.List"]

# .fsi files in compile order: structural-printer before formatter, mirroring the impl
# order. The last two are CLR-only: `formatter.fsi` names `TextWriter` / `StringBuilder` /
# `IsByRefLike`, and `structural-printer.fsi` an interface-dispatching `RuntimeFormatState`.
files = [
    "printf-format.fsi",
    "structural-printer.fsi",
    "formatter.fsi",
]

# The `.fs` compiled into Vesper.Printf.dll by this repo's own backend. CLR-bound:
# `Span` / `ArrayPool` / `Globalization`. A single-package compile is declaration-ordered,
# so `StructuralPrinter` must precede `Formatter.AppendStructured`'s call to it.
impl = [
    "printf-format.fs",
    "structural-printer.clr.fs",
    "formatter.clr.fs",
]
