# Vesper.Printf — printf as its own library.
#
# Same shape as src/Vesper.Core: the `.fsi` files are the front-end symbol
# contract (parsed by XParsec.FSharp, walked into an IExternalSymbolProvider);
# the runtime impl (`.fs`: the write-through handler body, the spec-runner, the
# `%A` synthesis) is compiled by this repo's own backend → Vesper.Printf.dll.
# No `.fsproj`: the printf functions are signature-only (lowered as intrinsics on
# the happy path), like the operators in Vesper.Core.
#
# Depends on Vesper.Core (Fun, unit, string). See ./README.md and
# ../XParsec.FSharp.SemanticAnalysis/docs/vesper-printf-plan.md.

[core]
namespace = "Vesper"
description = "printf / printfn / sprintf and the write-through format handler."

# Depends on Vesper.Core for the language primitives (`string`, `uint`, `char[]`,
# the arithmetic/equality operators) and Vesper.List for the cons-list (`[]` / `::`)
# the `%A` engine (`structural-printer.fs`) uses as its `Doc` child lists + frame
# stack.
depends-on = ["Vesper.Core", "Vesper.List"]

# .fsi files in compile order. printf-format (PrintfFormat type) before printf
# (its signatures reference PrintfFormat); formatter is independent.
files = [
    "printf-format.fsi",
    "formatter.fsi",
    "printf.fsi",
]

# The `.fs` compiled into Vesper.Printf.dll by this repo's own backend. Both halves
# of the printf stack are now Vesper-compiled (PP7d): the `%A` structural engine
# (`structural-printer.fs`, ported from `StructuralFormat.cs`) BEFORE the
# write-through format handler (`formatter.fs`, ported from `Formatter.cs`) — a
# single-package compile is declaration-ordered, so `StructuralPrinter` must precede
# `Formatter.AppendStructured`'s call to `StructuralPrinter.Print`.
impl = [
    "structural-printer.fs",
    "formatter.fs",
]

# JS-target inline-body source: none. The printf family is front-end special-cased on
# JS (lowered to `Format` nodes, not inline-spliced), and `formatter.fs` pulls in
# `System.Span`/`ArrayPool` — unresolvable under a BCL-free JS provider.
# An explicit empty override keeps `resolveInlineBodies
# (Some "js")` from falling back to the BCL-heavy base `impl`.
inline-bodies-js = []

# JS-target runtime asset: the committed `%A` structural formatter (`Vesper.Printf.mjs`),
# the JS analogue of the Vesper.Printf CLR DLL. The backend's `%A` (`Structured`) format
# holes import `structuralFormat` from here. GENERATED from
# `structural-printer.js.fs` (incl. surface-B width breaking) by the JS backend in library mode — the shape-keyed, Wadler-`Doc`-laid-out
# successor to the hand-authored asset (regenerable via the codegen-js test suite,
# `PrintfPhase3Tests`). It is NOT compiled
# from the printf `.fsi` contract (printf is front-end special-cased, lowered to `Format`
# nodes), so unlike Vesper.List it needs no `impl-js`/`inline-bodies-js` wiring — the source
# is a standalone runtime-asset, distinct from the CLR `structural-printer.fs`
# (interface-dispatch + BCL-heavy, a genuinely different artifact).
runtime-js = ["Vesper.Printf.mjs"]
