[core]
description = "printf / printfn / sprintf and the write-through format handler."

# Vesper.Core for the language primitives (`string`, `uint`, `char[]`, the
# arithmetic/equality operators); Vesper.List for the cons-list the CLR `%A` engine
# uses as its `Doc` child lists and frame stack.
depends-on = ["Vesper.Core", "Vesper.List"]

# .fsi files in compile order, on EVERY target: printf-format before printf, whose
# signatures reference `PrintfFormat`.
files = [
    "printf-format.fsi",
    "printf.fsi",
]

# Contracts that are DELIBERATELY impl-free on every target — the conformance pass
# accepts these and turns any OTHER `.fsi`-without-`.fs` into an FS0240 hard error.
# printf/printfn/sprintf are lowered inline to `Formatter`/`Format` by the front end,
# so there is no `.fs` body; `PrintfFormat` is still FSharp.Core's on the cold path.
sig-only = [
    "printf.fsi",
    "printf-format.fsi",
]

[targets.clr]
# CLR-only CONTRACTS, appended after `[core] files` — structural-printer before formatter,
# mirroring the impl order. CLR-only because `formatter.fsi` names `TextWriter` /
# `StringBuilder` / `IsByRefLike`, and `structural-printer.fsi` an interface-dispatching
# `RuntimeFormatState`; the JS `%A` engine is a free function instead.
files = [
    "structural-printer.fsi",
    "formatter.fsi",
]

# The `.fs` compiled into Vesper.Printf.dll by this repo's own backend. CLR-bound:
# `Span` / `ArrayPool` / `Globalization`. A single-package compile is declaration-ordered,
# so `StructuralPrinter` must precede `Formatter.AppendStructured`'s call to it.
impl = [
    "structural-printer.clr.fs",
    "formatter.clr.fs",
]

[targets.js]
# The standalone JS `%A` engine: a shape-keyed walker over the same Wadler `Doc` layout,
# but with no BCL and no interface dispatch. It implements no printf `.fsi` — on JS,
# printf lowers to `Format` nodes in the front end.
impl = [
    "structural-printer.js.fs",
]

# Its published surface (`structuralFormat`, `float32ToString`) IS its contract. Named
# here so the pairing rule never marries it to the CLR `structural-printer.fsi`.
impl-only = [
    "structural-printer.js.fs",
]

# JS-target runtime asset: `%A` holes import `structuralFormat` from here. GENERATED
# from `structural-printer.js.fs` by the JS backend in library mode, and checked against
# the committed copy by `StructuralPrinterTests`.
runtime = ["Vesper.Printf.mjs"]
