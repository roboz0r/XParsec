[core]
description = "printf / printfn / sprintf and the write-through format handler."

# Depends on Vesper.Core for the language primitives (`string`, `uint`, `char[]`,
# the arithmetic/equality operators) and Vesper.List for the cons-list (`[]` / `::`)
# the `%A` engine (`structural-printer.clr.fs`) uses as its `Doc` child lists + frame
# stack.
depends-on = ["Vesper.Core", "Vesper.List"]

# .fsi files in compile order. printf-format (PrintfFormat type) before printf
# (its signatures reference PrintfFormat); formatter is independent.
# structural-printer (the `%A` engine contract) before formatter, mirroring the impl
# order: `Formatter.AppendStructured` calls `StructuralPrinter.Print`.
files = [
    "printf-format.fsi",
    "structural-printer.fsi",
    "formatter.fsi",
    "printf.fsi",
]

# Contracts that are DELIBERATELY impl-free on every target — the conformance pass
# accepts these and turns any OTHER `.fsi`-without-`.fs` into an FS0240 hard error.
#   - printf/printfn/sprintf are front-end intrinsics, lowered inline to
#     `Formatter`/`Format` on the happy path (like the operators), so there is no
#     `.fs` body.
#   - `PrintfFormat` is still instantiated via FSharp.Core's `PrintfFormat`4` on the
#     cold path; self-hosting it + retargeting the recipe is a sequenced dependency
#     on the vesper-printf cold path.
sig-only = [
    "printf.fsi",
    "printf-format.fsi",
]

[targets.clr]
# The `.fs` compiled into Vesper.Printf.dll by this repo's own backend. CLR-bound:
# `Span` / `ArrayPool` / `Globalization`. The `%A` structural engine
# (`structural-printer.clr.fs`) BEFORE the write-through format handler (`formatter.clr.fs`) —
# a single-package compile is declaration-ordered, so `StructuralPrinter` must precede
# `Formatter.AppendStructured`'s call to `StructuralPrinter.Print`. Deliberately NOT
# shared: a JS provider resolves none of what these name.
impl = [
    "structural-printer.clr.fs",
    "formatter.clr.fs",
]

[targets.js]
# The standalone JS `%A` engine (incl. surface-B width breaking) — the shape-keyed,
# Wadler-`Doc`-laid-out successor to the hand-authored asset, and a genuinely different
# artifact from the CLR `structural-printer.clr.fs` (interface-dispatch + BCL-heavy). It
# implements no printf `.fsi`: printf is front-end special-cased on JS (lowered to
# `Format` nodes, never inline-spliced).
impl = [
    "structural-printer.js.fs",
]

# JS-target runtime asset: the committed `%A` structural formatter, the JS analogue of
# the Vesper.Printf CLR DLL. The backend's `%A` (`Structured`) format holes import
# `structuralFormat` from here. GENERATED from `structural-printer.js.fs` by the JS
# backend in library mode; regenerable via the codegen-js test suite
# (`StructuralPrinterTests`).
runtime = ["Vesper.Printf.mjs"]
