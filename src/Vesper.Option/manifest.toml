[core]
name = "Vesper.Option"
description = "The option type and the Option module."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "option.fsi",
]

# Target-NEUTRAL: pure data, no inline IL and no BCL name.
impl = [
    "option.fs",
]

[targets.js]
# JS runtime *asset*: the `Option` module functions a consumer imports + ships beside
# its output (the option *type* itself rides inline via the external-union path, like
# any union — only the module functions need the import). GENERATED from `option.fs`,
# not hand-authored; regenerable via the codegen-js test suite.
runtime = ["Vesper.Option.mjs"]
