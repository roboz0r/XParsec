# Vesper.Option — the option type + the `Option` module as a standalone package
# (package-split-plan PS1: one package per type; PS2: one impl DLL per package).
#
# Same shape as src/Vesper.Core and src/Vesper.Printf: the `.fsi` is the
# front-end symbol contract (parsed by XParsec.FSharp, walked into an
# IExternalSymbolProvider); `option.fs` is the runtime impl compiled by this
# repo's own backend → Vesper.Option.dll (BCL-only, no FSharp.Core). No
# `.fsproj`: like its siblings this tree is not built by `dotnet`/`fsc`.
#
# Depends on Vesper.Core (`Fun`, `unit`, `bool`, `int`). `name` and `depends-on`
# are recorded here per the package-split-plan package schema; the root-manifest
# / a la carte loader wiring (PS-Loader) is a separate follow-up — these
# self-contained package manifests are consumed today by the parser golden tests
# (test/XParsec.FSharp.Tests/VesperCoreContractTests.fs).
#
# See ./README.md and
# ../XParsec.FSharp.SemanticAnalysis/docs/package-split-plan.md.

[core]
name = "Vesper.Option"
namespace = "Vesper"
description = "The option type and the Option module."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "option.fsi",
]

# Runtime impl `.fs` files (our-backend target source).
impl = [
    "option.fs",
]
