[core]
name = "Vesper.Array"
description = "The Array module over the intrinsic 'T[] type (zeroCreate, get/set, map/iter/fold, ...)."
depends-on = ["Vesper.Core"]

# Contract `.fsi` files in compile order (one, today).
files = [
    "array.fsi",
]

[targets.clr]
# CLR-bound: `zeroCreate`'s `newarr` inline IL. No JS body ships yet.
impl = [
    "array.clr.fs",
]
